# Skills（APM）: マニフェスト検証・lock ドリフト検出・セキュリティ監査（SARIF）・Waza 評価
# ロジックは tools/ci/ 以下のスクリプトに分離している
name: skills
on:
  push:
    paths:
      - 'skills/**'
      - 'tools/ci/**'
      - '.github/workflows/skills.yml'
  pull_request:
    paths:
      - 'skills/**'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write # SARIF を Code Scanning へ上げるため
jobs:
  verify:
    name: APM（lock ドリフト / 監査）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: APM を導入
        shell: pwsh
        run: ./tools/ci/install-apm.ps1
      - name: マニフェスト配置・lock ドリフト・監査
        shell: pwsh
        run: ./tools/ci/skills-verify.ps1 -SarifPath apm-audit.sarif
      - name: SARIF を Code Scanning へ
        if: ${{ always() && hashFiles('apm-audit.sarif') != '' }}
        continue-on-error: true   # アップロード API の一時的な失敗でジョブを落とさない
        uses: github/codeql-action/upload-sarif@24c54180a607e11b4d6e1b0e1a2b3c4d5e6f7a8b # v4
        with:
          sarif_file: apm-audit.sarif
          category: apm-audit
  waza:
    name: Waza（Skill 評価）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Skill の健全性チェック
        shell: pwsh
        run: ./tools/ci/waza-check.ps1
