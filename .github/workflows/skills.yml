# Skills (APM): manifest verification, lock drift detection, security audit (SARIF), Waza evaluation
# Logic is split into scripts under tools/ci/
name: skills
on:
  push:
    branches: [main] # pull_request と重複して同じコミットで走らないようにする
    paths:
      - 'skills/**'
      - 'tools/ci/**'
      - 'tools/lib/common.ps1'
      - '.github/workflows/skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'tools/ci/install-apm.ps1'
      - 'tools/ci/skills-verify.ps1'
      - 'tools/lib/common.ps1'
      - '.github/workflows/skills.yml'
  workflow_dispatch:
# Permissions are granted per job (the workflow itself only reads).
permissions: {}
concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: APM（lock ドリフト / 監査）
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # SARIF を Code Scanning へアップロードするため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: APM を導入
        shell: pwsh
        run: ./tools/ci/install-apm.ps1
      - name: マニフェスト配置・lock ドリフト・監査
        shell: pwsh
        run: ./tools/ci/skills-verify.ps1 -SarifPath apm-audit.sarif
      - name: SARIF を Code Scanning へ
        if: ${{ always() && hashFiles('apm-audit.sarif') != '' }}
        continue-on-error: true   # do not fail the job on a transient upload API error
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: apm-audit.sarif
          category: apm-audit