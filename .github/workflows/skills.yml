# Skills (APM): manifest verification, lock drift detection, security audit (SARIF), Waza evaluation
# Logic is split into scripts under tools/ci/
name: skills
on:
  push:
    paths:
      - 'skills/**'
      - 'tools/ci/**'
      - '.github/workflows/skills.yml'
  pull_request:
    paths:
      - 'skills/**'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write # to upload SARIF to Code Scanning
concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: APM（lock ドリフト / 監査）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: APM を導入
        shell: pwsh
        run: ./tools/ci/install-apm.ps1
      - name: マニフェスト配置・lock ドリフト・監査
        shell: pwsh
        run: ./tools/ci/skills-verify.ps1 -SarifPath apm-audit.sarif
      - name: SARIF を Code Scanning へ
        if: ${{ always() && hashFiles('apm-audit.sarif') != '' }}
        continue-on-error: true   # do not fail the job on a transient upload API error
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: apm-audit.sarif
          category: apm-audit
  waza:
    name: Waza（Skill 評価）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.2
      - name: Skill の健全性チェック
        shell: pwsh
        run: ./tools/ci/waza-check.ps1
