# Skills（APM）: マニフェスト検証・lock ドリフト検出・セキュリティ監査
# Windows ランナー（apm は winget の Microsoft.APM）
name: skills

on:
  push:
    paths: ['skills/**', '.github/workflows/skills.yml']
  pull_request:
    paths: ['skills/**']
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # SARIF を Code Scanning へ上げるため

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: APM を導入
        shell: pwsh
        run: |
          winget install --id Microsoft.APM --exact --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          $apm = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\Microsoft.APM_*" -Recurse -Filter apm.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $apm) { throw "apm.exe が見つかりません" }
          "APM_DIR=" + (Split-Path $apm) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $apm --version

      - name: マニフェストをグローバルへ配置して導入
        shell: pwsh
        run: |
          $dst = "$env:USERPROFILE\.apm"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item skills\apm.yml $dst -Force
          if (Test-Path skills\apm.lock.yaml) { Copy-Item skills\apm.lock.yaml $dst -Force }
          Push-Location $dst
          try {
            & "$env:APM_DIR\apm.exe" lock --global
            & "$env:APM_DIR\apm.exe" install --global
          } finally { Pop-Location }

      - name: lock のドリフトを検出
        shell: pwsh
        run: |
          if (-not (Test-Path skills\apm.lock.yaml)) { Write-Host "[i] apm.lock.yaml 未作成のためスキップ"; exit 0 }

          function Get-Pins([string]$path) {
            $repo=$null; $ref=$null; $sha=$null; $out=@()
            foreach ($l in (Get-Content $path -Encoding UTF8)) {
              if     ($l -match '^\s*-\s*repo_url:\s*(\S+)')        { if ($repo) { $out += "$repo|$ref|$sha" }; $repo=$Matches[1]; $ref=$null; $sha=$null }
              elseif ($l -match '^\s*resolved_ref:\s*(\S+)')        { $ref=$Matches[1] }
              elseif ($l -match '^\s*resolved_commit:\s*(\S+)')     { $sha=$Matches[1] }
            }
            if ($repo) { $out += "$repo|$ref|$sha" }
            $out | Sort-Object
          }

          $repoPins = Get-Pins skills\apm.lock.yaml
          $ciPins   = Get-Pins "$env:USERPROFILE\.apm\apm.lock.yaml"
          Write-Host "--- リポジトリ ---"; $repoPins
          Write-Host "--- CI 生成 ---";   $ciPins
          if (Compare-Object $repoPins $ciPins) {
            Write-Host "::error::apm.lock.yaml のピン（repo_url / ref / commit）が一致しません。tools/skills-apply.ps1 -Lock または tools/sync.ps1 を実行してください。"
            exit 1
          }
          Write-Host "OK: apm.lock.yaml のピンは一致"

      - name: セキュリティ監査（hidden Unicode / drift / policy）
        shell: pwsh
        continue-on-error: true
        run: |
          Push-Location "$env:USERPROFILE\.apm"
          try {
            & "$env:APM_DIR\apm.exe" audit --ci --format sarif --output "$env:GITHUB_WORKSPACE\apm-audit.sarif"
            "APM_AUDIT_EXIT=$LASTEXITCODE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally { Pop-Location }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\apm-audit.sarif")) {
            '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' |
              Set-Content "$env:GITHUB_WORKSPACE\apm-audit.sarif" -Encoding utf8
          }

      - name: SARIF を Code Scanning へ
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: apm-audit.sarif
          category: apm-audit

      - name: 監査結果を評価（CI ゲート）
        shell: pwsh
        run: |
          if ($env:APM_AUDIT_EXIT -and $env:APM_AUDIT_EXIT -ne '0') {
            Write-Host "::warning::apm audit が違反を検出しました（SARIF を参照）"
          } else { Write-Host "OK: apm audit クリーン" }

  waza:
    name: Waza（Skill の回帰ゲート）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: waza を導入（mise）
        uses: jdx/mise-action@v5
      - name: Skill の健全性チェック
        shell: pwsh
        continue-on-error: true
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/mise/mise.toml
        run: |
          if (Test-Path skills) {
            waza check skills || Write-Host "::warning::waza check が指摘あり（初期は許容）"
          }
