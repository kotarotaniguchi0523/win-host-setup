# Renovate (self-hosted) - create PRs that auto-update dependencies
# Requires: register `RENOVATE_TOKEN` (a repo-scoped PAT) in the repository Secrets
#   * A PAT is recommended because PRs created with `GITHUB_TOKEN` do not trigger other workflows
name: renovate
on:
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 JST
  workflow_dispatch:
    inputs:
      logLevel:
        description: ログレベル
        type: choice
        default: info
        options: [info, debug]
permissions:
  contents: read
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # mise.lock regeneration is handled by relock.yml, so do not run it here
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '[]'
