# Renovate が mise 設定を更新したら mise.lock を再生成して同じ PR に積む
# ロジックは tools/ci/mise-verify.ps1 -Lock（ローカルでも同じコマンドで再現できる）
name: relock

on:
  pull_request:
    paths:
      - 'mise/mise.toml'
      - 'mise/mise.lock'

permissions:
  contents: write

concurrency:
  group: relock-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  relock:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: jdx/mise-action@v5
        with:
          install: false

      - name: lock を再生成してリポジトリへ書き戻す
        shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Lock

      - name: ロックをコミット
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mise
          if git diff --cached --quiet; then
            echo "ロックに変更なし"
          else
            git commit -m "chore(mise): mise.lock を再生成"
            git push
          fi
