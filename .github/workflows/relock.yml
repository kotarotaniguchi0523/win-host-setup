# When Renovate updates the mise config, regenerate mise.lock and push it onto the same PR
# Logic is in tools/ci/mise-verify.ps1 -Lock (reproducible locally with the same command)
name: relock
on:
  pull_request:
    paths:
      - 'mise/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'tools/ci/mise-verify.ps1'
      - 'tools/lib/common.ps1'
      - '.github/workflows/relock.yml'
# Permissions are granted per job (the workflow itself needs none).
permissions: {}
concurrency:
  group: relock-${{ github.head_ref }}
  cancel-in-progress: true

# Raise the GitHub API rate limit for the mise installs (attestation verification uses the API)
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  relock:
    name: relock
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The default token stays read-only: the commit is pushed with a short-lived
    # GitHub App token instead. Pushes made with GITHUB_TOKEN are authored by
    # github-actions[bot], which GitHub treats as an outside contributor, so every
    # workflow on that PR would sit in "action_required" (approval) until a maintainer
    # approves it. An App installation token is not gated.
    permissions:
      contents: read
    # The App private key lives in an environment secret (no protection rules).
    environment: relock
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # 可変 ref を避ける（TOCTOU）
          persist-credentials: false   # push via gh auth setup-git
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
      - name: lock を再生成してリポジトリへ書き戻す
        shell: pwsh
        run: |
          mise lock
          ./tools/ci/mise-verify.ps1 -Lock
      - name: Check whether the lock changed
        id: lock-diff
        shell: bash
        run: |
          if git diff --quiet -- mise mise.toml mise.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: push 用の App トークンを取得
        id: app-token
        if: ${{ steps.lock-diff.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELOCK_APP_CLIENT_ID || secrets.RELOCK_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELOCK_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: ロックをコミット
        if: ${{ steps.lock-diff.outputs.changed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          gh auth setup-git   # authenticate via gh because persist-credentials: false
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add mise mise.toml mise.lock
          if git diff --cached --quiet; then
            echo "ロックに変更なし"
          else
            git commit -m "chore(mise): mise.lock を再生成"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi
