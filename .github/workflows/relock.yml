# Renovate が mise 設定を更新したら mise.lock を再生成して同じ PR に積む
# ロジックは tools/ci/mise-verify.ps1 -Lock（ローカルでも同じコマンドで再現できる）
name: relock
on:
  pull_request:
    paths:
      - 'mise/mise.toml'
      - 'mise/mise.lock'
permissions:
  contents: write
concurrency:
  group: relock-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  relock:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false   # push は gh auth setup-git 経由で行う
      - uses: jdx/mise-action@v5.1.2
        with:
          install: false
      - name: lock を再生成してリポジトリへ書き戻す
        shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Lock
      - name: ロックをコミット
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git   # persist-credentials: false のため gh 経由で認証する
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mise
          if git diff --cached --quiet; then
            echo "ロックに変更なし"
          else
            git commit -m "chore(mise): mise.lock を再生成"
            git push
          fi
