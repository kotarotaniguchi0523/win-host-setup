# When Renovate updates the mise config, regenerate mise.lock and push it onto the same PR
# Logic is in tools/ci/mise-verify.ps1 -Lock (reproducible locally with the same command)
name: relock
on:
  pull_request:
    paths:
      - 'mise/mise.toml'
      - 'mise/mise.lock'
# Permissions are granted per job (the workflow itself needs none).
permissions: {}
concurrency:
  group: relock-${{ github.head_ref }}
  cancel-in-progress: true

# Raise the GitHub API rate limit for the mise installs (attestation verification uses the API)
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  relock:
    name: relock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # 再生成した mise.lock を同じ PR へコミットするため
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false   # push via gh auth setup-git
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
      - name: lock を再生成してリポジトリへ書き戻す
        shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Lock
      - name: ロックをコミット
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git   # authenticate via gh because persist-credentials: false
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mise
          if git diff --cached --quiet; then
            echo "ロックに変更なし"
          else
            git commit -m "chore(mise): mise.lock を再生成"
            git push
          fi