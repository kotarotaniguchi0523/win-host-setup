# Lint: actions/SARIF is isolated; secret scanning and PII share a runner using parallel steps.
#  - Scripts are invoked directly and remain reproducible locally.
#  - Delegate tool caching to jdx/mise-action (the mise tool store)
#    (do not use actions/cache because a PR could poison the cache)
#
# These checks stay in CI even though hk runs them locally, because a pull request opened on
# GitHub (Renovate, Dependabot, an outside contributor) never runs the local hooks:
#  - secrets: GitHub push protection only covers known providers, and the non-provider pattern
#    scanning feature is not available on this repository
#  - PII: a leak here is public and cannot be undone, and no platform-side control covers it
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}
env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed CI areas
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      mise: ${{ steps.diff.outputs.mise }}
      config: ${{ steps.diff.outputs.config }}
      python: ${{ steps.diff.outputs.python }}
      actions: ${{ steps.diff.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        shell: bash
        run: python3 tools/ci/changes.py

  actions:
    needs: changes
    if: ${{ needs.changes.outputs.actions == 'true' }}
    permissions:
      contents: read
      security-events: write # Upload the Actions linter SARIF report
    name: Actions Lint（actionlint / sisakulint / pinact）
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true
          install_args: github:jdx/jactionlint go:github.com/sisaku-security/sisakulint/cmd/sisakulint pinact shellcheck
      - name: Lint
        shell: pwsh
        run: ./tools/lint/actions.ps1
      - name: SARIF（sisakulint）
        if: ${{ always() && hashFiles('sisakulint.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sisakulint.sarif
          category: sisakulint

  powershell:
    permissions:
      contents: read
    name: PowerShell (PSScriptAnalyzer)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Repository PSGallery -RequiredVersion 1.25.0 -Force -Confirm:$false
      - name: Analyze
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./tools -Recurse -Severity Error
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host '[ok] PSScriptAnalyzer'

  secrets:
    permissions:
      contents: read
    name: 秘密情報（betterleaks / secretlint）
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # because betterleaks scans the history
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true
          install_args: betterleaks
      # Share the full-history checkout and tool bootstrap; independent checks run concurrently.
      - parallel:
          - name: 秘密情報スキャン
            shell: pwsh
            run: ./tools/lint/secrets.ps1
          - name: PII 検査
            shell: pwsh
            run: ./tools/depii.ps1 -Check -SkipEnvRules
          - name: 個人パス・衛生検査
            shell: pwsh
            run: ./tools/ci/hygiene.ps1

  # Preserve the pre-optimization required check name without provisioning
  # another full toolchain. The actual PII and hygiene scans run as parallel
  # steps inside the read-only secrets job; this bridge fails closed if that
  # job does not succeed.
  pii:
    name: PII・衛生（depii / hygiene）
    needs: secrets
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Verify PII and hygiene checks completed successfully
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SECRETS_RESULT" != "success" ]]; then
            echo "::error::The combined secrets, PII, and hygiene scans did not succeed ($SECRETS_RESULT)"
            exit 1
          fi
          echo "PII and hygiene scans passed as part of the secrets job"

  result:
    name: lint result
    needs: [changes, actions, secrets, pii]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require selected checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          for name in ('changes', 'secrets', 'pii'):
              assert jobs[name]['result'] == 'success', f'{name} did not succeed'
          selected = jobs['changes']['outputs']['actions'] == 'true'
          expected = 'success' if selected else 'skipped'
          assert jobs['actions']['result'] == expected, 'Actions lint did not complete as selected'
          PY
