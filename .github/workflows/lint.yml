# Lint (parallel jobs): run Actions / secrets / PII in independent jobs at the same time
#  - Each job just calls a script in tools/lint/ or tools/ci/ (reproducible locally with the same command)
#  - Delegate tool caching to jdx/mise-action (the mise tool store)
#    (do not use actions/cache because a PR could poison the cache)
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Actions Lint（actionlint / sisakulint / pinact）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.2
        with:
          cache: true
      - name: Lint
        shell: pwsh
        run: ./tools/lint/actions.ps1 -SkipSisakulint
      - name: SARIF（sisakulint）
        if: ${{ always() && hashFiles('sisakulint.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: sisakulint.sarif
          category: sisakulint
