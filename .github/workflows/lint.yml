# Lint (parallel jobs): run Actions / secrets / PII in independent jobs at the same time
#  - Each job just calls a script in tools/lint/ or tools/ci/ (reproducible locally with the same command)
#  - Delegate tool caching to jdx/mise-action (the mise tool store)
#    (do not use actions/cache because a PR could poison the cache)
#
# These checks stay in CI even though hk runs them locally, because a pull request opened on
# GitHub (Renovate, Dependabot, an outside contributor) never runs the local hooks:
#  - secrets: GitHub push protection only covers known providers, and the non-provider pattern
#    scanning feature is not available on this repository
#  - PII: a leak here is public and cannot be undone, and no platform-side control covers it
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Raise the GitHub API rate limit for the mise installs (attestation verification uses the API)
env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Actions Lint（actionlint / sisakulint / pinact）
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
      - name: Lint
        shell: pwsh
        run: ./tools/lint/actions.ps1
      - name: SARIF（sisakulint）
        if: ${{ always() && hashFiles('sisakulint.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sisakulint.sarif
          category: sisakulint

  secrets:
    name: 秘密情報（betterleaks / secretlint）
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # because betterleaks scans the history
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
      - name: スキャン
        shell: pwsh
        run: ./tools/lint/secrets.ps1

  pii:
    name: PII・衛生（depii / hygiene）
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # -SkipEnvRules: on a runner the account and host name are generic, so deriving patterns from
      # them only produces false positives. Generic personal paths are covered by hygiene.ps1 below.
      - name: PII 検査
        shell: pwsh
        run: ./tools/depii.ps1 -Check -SkipEnvRules
      - name: 個人パス・衛生検査
        shell: pwsh
        run: ./tools/ci/hygiene.ps1