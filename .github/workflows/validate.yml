# On every PR / push, verify "lock consistency", "config syntax", and "scripts" (parallel jobs)
# Lint (Actions / secrets / PII) is handled by lint.yml.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}
env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  mise:
    permissions:
      contents: read
    name: mise（lock 整合性）
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
          cache: true
      - name: lock のドリフト検出と導入
        shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Summary

  config:
    permissions:
      contents: read
    name: 設定ファイルの構文
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
          install: false # uv だけを入れる（全ツールの導入は重い）
      - name: JSON / YAML / TOML の検証
        run: |
          mise install uv
          uv run --no-project --python 3.13 --with 'pyyaml==6.0.3' --exclude-newer="3 days" python tools/ci/lint-config.py

  python:
    permissions:
      contents: read
    name: Python（pathctl の型チェック）
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: true
      - name: 依存を同期（dev は ty のみ）
        run: uv sync --project tools/pathctl --frozen
      - name: 型チェック
        run: uv run --project tools/pathctl ty check --python-platform win32 tools/pathctl
      - name: テスト（unittest）
        run: uv run --project tools/pathctl python -m unittest discover -s tools/pathctl/tests
      - name: JSON 契約の確認
        run: uv run --project tools/pathctl pathctl schema --json > /dev/null