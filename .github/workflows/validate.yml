# PR / push のたびに「lock の整合性」「設定の構文」「スクリプト」を検証する（並列ジョブ）
# Lint（Actions / 秘密情報 / PII）は lint.yml が担当する。
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mise:
    name: mise（lock 整合性）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.2
        with:
          install: false
          cache: true
      - name: lock のドリフト検出と導入
        shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Summary

  config:
    name: 設定ファイルの構文
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: JSON / YAML / TOML の検証
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 tools/ci/lint-config.py

  scripts:
    name: PowerShell 静的チェック
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $issues = Invoke-ScriptAnalyzer -Path ./tools -Recurse -Severity Error
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 }
          Write-Host '[ok] PSScriptAnalyzer（Error なし）'
