# On every PR / push, verify "lock consistency", "config syntax", and "scripts" (parallel jobs)
# Lint (Actions / secrets / PII) is handled by lint.yml.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}
env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changed CI areas
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      mise: ${{ steps.diff.outputs.mise }}
      config: ${{ steps.diff.outputs.config }}
      python: ${{ steps.diff.outputs.python }}
      actions: ${{ steps.diff.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        shell: bash
        run: python3 tools/ci/changes.py

  mise:
    needs: changes
    if: ${{ needs.changes.outputs.mise == 'true' }}
    permissions:
      contents: read
    name: mise（lock 整合性）
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
          cache: true
      - name: lock のドリフト検出と導入
        shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Summary

  config:
    needs: changes
    if: ${{ needs.changes.outputs.config == 'true' }}
    permissions:
      contents: read
    name: 設定ファイルの構文
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true
          install: false # uv だけを入れる（全ツールの導入は重い）
      - name: JSON / YAML / TOML の検証
        run: |
          mise install uv
          uv run --no-project --python 3.13 --with 'pyyaml==6.0.3' --exclude-newer="3 days" python tools/ci/lint-config.py
      - name: pin の厳密性（latest / 範囲 / ブランチ ref を拒否）
        run: |
          uv run --no-project --python 3.13 --with 'pyyaml==6.0.3' --exclude-newer="3 days" python tools/ci/lint-pins.py

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    permissions:
      contents: read
    name: Python（pathctl の型チェック）
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true
          install_args: uv python
      - name: 依存を同期（dev は ty のみ）
        run: uv sync --project tools/pathctl --frozen
      # The environment was created by uv sync above; parallel runs must not mutate it.
      - parallel:
          - name: 型チェック
            run: uv run --no-sync --project tools/pathctl ty check --python-platform win32 tools/pathctl
          - name: テスト（unittest）
            run: uv run --no-sync --project tools/pathctl python -m unittest discover -s tools/pathctl/tests
          - name: JSON 契約の確認
            run: uv run --no-sync --project tools/pathctl pathctl schema --json > /dev/null
  ci-tests:
    name: CI regression tests
    permissions:
      contents: read
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/ci/tests -v

  result:
    name: validate result
    needs: [changes, mise, config, python, ci-tests]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require selected checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success', 'Change detection failed'
          selected = jobs['changes']['outputs']
          for name, job in jobs.items():
              if name == 'changes':
                  continue
              area = 'python' if name == 'ci-tests' else name
              expected = 'success' if selected[area] == 'true' else 'skipped'
              assert job['result'] == expected, f"{name}: {job['result']} (expected {expected})"
          PY
