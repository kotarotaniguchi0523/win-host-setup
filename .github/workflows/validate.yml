# On every PR / push, verify "lock consistency", "config syntax", and "scripts" (parallel jobs)
# Lint (Actions / secrets / PII) is handled by lint.yml.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Raise the GitHub API rate limit for the mise installs (attestation verification uses the API)
env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mise:
    name: mise（lock 整合性）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.2
        with:
          install: false
          cache: true
      - name: lock のドリフト検出と導入
        shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Summary

  config:
    name: 設定ファイルの構文
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: JSON / YAML / TOML の検証
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 tools/ci/lint-config.py

  python:
    name: Python（pathctl の型チェック）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.2
        with:
          cache: true
      - name: 依存を同期（dev は ty のみ）
        run: uv sync --project tools/pathctl --frozen
      - name: 型チェック
        run: uv run --project tools/pathctl ty check tools/pathctl
      - name: JSON 契約の確認
        run: uv run --project tools/pathctl pathctl schema --json > /dev/null
