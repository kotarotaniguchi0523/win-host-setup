# skills-relock.yml - when Renovate updates skills/apm.yml, regenerate apm.lock.yaml and push it onto the same PR
# (Counterpart to mise's relock.yml. Without it, a PR could pass with the declaration and lock out of sync.)
name: skills-relock

on:
  pull_request:
    paths:
      - 'skills/apm.yml'

# Permissions are granted per job (the workflow itself needs none).
permissions: {}

concurrency:
  group: skills-relock-${{ github.head_ref }}
  cancel-in-progress: true

# Raise the GitHub API rate limit for the mise installs (attestation verification uses the API)
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  relock:
    name: relock
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write # 再生成した apm.lock.yaml を同じ PR へコミットするため
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false # push via gh auth setup-git

      - name: APM を導入
        shell: pwsh
        run: ./tools/ci/install-apm.ps1

      - name: apm.lock.yaml を再生成してリポジトリへ書き戻す
        shell: pwsh
        run: |
          ./tools/ci/skills-verify.ps1 -SkipAudit -Relock

      - name: ロックをコミット
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills
          if git diff --cached --quiet; then
            echo "ロックに変更なし"
          else
            git commit -m "chore(skills): apm.lock.yaml を再生成"
            git push
          fi