# skills-relock.yml - when Renovate updates skills/apm.yml, regenerate apm.lock.yaml and push it onto the same PR
# (Counterpart to mise's relock.yml. Without it, a PR could pass with the declaration and lock out of sync.)
name: skills-relock

on:
  pull_request:
    paths:
      - 'skills/apm.yml'

permissions:
  contents: write

concurrency:
  group: skills-relock-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  relock:
    runs-on: windows-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false # push via gh auth setup-git

      - name: APM を導入
        shell: pwsh
        run: ./tools/ci/install-apm.ps1

      - name: apm.lock.yaml を再生成してリポジトリへ書き戻す
        shell: pwsh
        run: |
          ./tools/ci/skills-verify.ps1 -SkipAudit -Relock

      - name: ロックをコミット
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills
          if git diff --cached --quiet; then
            echo "ロックに変更なし"
          else
            git commit -m "chore(skills): apm.lock.yaml を再生成"
            git push
          fi
