# Weekly health check (maintenance operations via CI)
#  - mise: lock drift detection / update candidates
#  - winget: divergence between DSC pins and the latest versions
#  - hygiene: check for leaked personal paths etc.
# Logic is split into tools/ci/ and tools/update-winget-dsc.ps1
name: healthcheck
on:
  schedule:
    - cron: '0 18 * * 6' # Sunday 03:00 JST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: healthcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Raise the GitHub API rate limit for the mise installs (attestation verification uses the API)
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  mise:
    name: mise（ドリフト / 更新候補）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          cache: true
      - shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Summary
  winget:
    name: winget（DSC の乖離）
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/update-winget-dsc.ps1
  hygiene:
    name: 公開リポジトリの衛生
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/ci/hygiene.ps1