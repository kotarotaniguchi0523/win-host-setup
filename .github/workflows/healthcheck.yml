# Weekly health check (maintenance operations via CI)
#  - mise: lock drift detection / update candidates
#  - winget: divergence between DSC pins and the latest versions
#  - hygiene: check for leaked personal paths etc.
# Logic is split into tools/ci/ and tools/update-winget-dsc.ps1
name: healthcheck
on:
  schedule:
    - cron: '0 18 * * 6' # Sunday 03:00 JST
  workflow_dispatch:
permissions: {}
concurrency:
  group: healthcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Raise the GitHub API rate limit for the mise installs (attestation verification uses the API)
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  mise:
    permissions:
      contents: read
    name: mise（ドリフト / 更新候補）
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
          cache: true
      - shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Summary
  winget:
    permissions:
      contents: read
    name: winget（DSC の乖離）
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/update-winget-dsc.ps1
  hygiene:
    permissions:
      contents: read
    name: 公開リポジトリの衛生
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/ci/hygiene.ps1