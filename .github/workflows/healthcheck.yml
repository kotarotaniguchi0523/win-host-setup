# 週次の健全性チェック（CI による保守運用）
#  - mise: lock のドリフト検出 / 更新候補
#  - winget: DSC のピンと最新版の乖離
#  - 衛生: 個人パス等の混入検査
# ロジックは tools/ci/ と tools/update-winget-dsc.ps1 に分離している
name: healthcheck
on:
  schedule:
    - cron: '0 18 * * 6' # 日曜 03:00 JST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mise:
    name: mise（ドリフト / 更新候補）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.2
        with:
          install: false
          cache: true
      - shell: pwsh
        run: ./tools/ci/mise-verify.ps1 -Summary
  winget:
    name: winget（DSC の乖離）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/update-winget-dsc.ps1
  hygiene:
    name: 公開リポジトリの衛生
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./tools/ci/hygiene.ps1
