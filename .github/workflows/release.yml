# Release tools/pathctl with SLSA Build Level 3 provenance.
#
# Design notes (build track of SLSA v1.0; see tools/pathctl/README.md for the mapping):
#   - The build is defined entirely as this file: no manual steps, no local artifacts.
#   - The build runs on a GitHub-hosted, ephemeral runner and does NOT restore any cache,
#     so a previous run cannot influence the binaries (no poisoned tool store).
#   - Tool versions come from mise.toml/mise.lock (installed with --locked) and the Python
#     dependencies from uv.lock (`uv sync --frozen`).
#   - The artifacts are built ONCE, their digests are recorded, they are uploaded as an
#     artifact, and the release / PyPI jobs publish exactly those files (no rebuild).
#   - Provenance is generated by GitHub itself (not by a script in this repository) through
#     `actions/attest-build-provenance`, which signs with the workflow's OIDC identity.
#     For PyPI, `astral-sh/attest-action` generates the PEP 740 publish attestations and
#     `uv publish` uploads them alongside the distributions (no token either).
#
# Tag form: pathctl-v<version>, and the tag must match [project] version in
# tools/pathctl/pyproject.toml. PyPI publishing runs only when the repository variable
# PYPI_PUBLISH is 'true' (see the README for the one-time Trusted Publisher setup).
name: release

on:
  push:
    tags:
      - 'pathctl-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ビルドと provenance（SLSA Build L3）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC identity used to sign the provenance
      attestations: write # write the attestation into GitHub's store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cache: false is deliberate: SLSA Build L3 builds must not be influenced by a cache
      # that an earlier (possibly untrusted) run could have written to.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false

      - name: タグと pyproject の version が一致するか確認
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv version --project tools/pathctl --short)"
          tag="${GITHUB_REF_NAME#pathctl-v}"
          if [ "$version" != "$tag" ]; then
            echo "タグ ($GITHUB_REF_NAME) と pyproject の version ($version) が違います" >&2
            exit 1
          fi

      - name: テストと型チェック（ビルド前に検証する）
        run: |
          set -euo pipefail
          uv sync --project tools/pathctl --frozen
          uv run --project tools/pathctl python -m unittest discover -s tools/pathctl/tests
          uv run --project tools/pathctl ty check --python-platform win32 tools/pathctl

      - name: ビルド（sdist / wheel）
        run: uv build --project tools/pathctl

      - name: ダイジェストを記録
        shell: bash
        run: |
          set -euo pipefail
          cd tools/pathctl/dist
          # ファイル名は相対（./ を付けない）: 受け取った人が `sha256sum -c SHA256SUMS` を
          # 同じディレクトリで実行できる形にする
          sha256sum ./*.whl ./*.tar.gz | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS
          {
            echo '### pathctl build digests'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ビルドした wheel を実際に動かす（パッケージング回帰の検出）
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls tools/pathctl/dist/*.whl)"
          uvx --from "$wheel" pathctl --version
          uvx --from "$wheel" pathctl docs show agents > /dev/null
          uvx --from "$wheel" pathctl describe --format json > /dev/null

      - name: 成果物をアップロード（公開するのはこのファイルだけ）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            tools/pathctl/dist/*.whl
            tools/pathctl/dist/*.tar.gz
            tools/pathctl/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: provenance を発行（GitHub が署名。SLSA Build L3）
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            tools/pathctl/dist/*.whl
            tools/pathctl/dist/*.tar.gz
          # 検証は `gh attestation verify <file> --repo <owner>/<repo>`

  github-release:
    name: GitHub Release へ添付
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: ダイジェストを再検証（改ざんされていないこと）
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Release を作成して添付
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "pathctl ${GITHUB_REF_NAME#pathctl-v}" \
            --generate-notes \
            dist/*

  pypi:
    name: PyPI へ公開（trusted publishing / PEP 740）
    needs: build
    if: ${{ vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi # PyPI 側の Trusted Publisher と同じ Environment 名にする
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing + PEP 740 attestation の署名
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # mise.toml / mise.lock を読ませるために checkout が要る（ここで uv が入る）
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false

      - name: ダイジェストを再検証
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      # ビルドし直さないこと: provenance とダイジェストが指すファイルをそのまま公開する。
      # PEP 740 の publish attestation は uv 自身は生成しない。専用アクションで dist/ に
      # 生成し、uv publish に拾わせる（uv 0.9.12 以降 + id-token: write が前提）。
      - name: PEP 740 の attestation を生成
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        env:
          # このアクションは sigstore（pydantic-core = pyo3）を自前の venv に導入する。
          # pyo3 は Python 3.15 に未対応なので、mise の 3.15 ではなく 3.12 を使わせる。
          UV_PYTHON: '3.12'

      - name: PyPI へ公開
        shell: bash
        run: uv publish --trusted-publishing always dist/*