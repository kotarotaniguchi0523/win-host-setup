# Dependabot: update GitHub Actions references (used together with the Actions lock)
# - Pin workflows by SHA / tag, and .github/workflows/actions.lock guarantees the actual commit
# - Renovate handles mise / winget / Skills updates (only the github-actions ecosystem here, to avoid duplication)
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '18:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 2 # do not propose releases younger than 2 days (matches mise minimum_release_age)
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(actions)'
    labels:
      - dependencies
