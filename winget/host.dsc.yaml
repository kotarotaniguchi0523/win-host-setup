# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# winget declaration for the Windows host (idempotent, version-pinned). Apply: winget configure winget/host.dsc.yaml
# Policy: AGENTS.md / AUDIT.md. mise-managed items live on the mise/config.toml side. Use source: msstore explicitly for Store apps.
properties:
  configurationVersion: 0.2.0
  resources:
    # --- Dev foundation ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: mise
      directives:
        # 2026.11.14: 組み込み aube が npm.flatt.tech の巨大 packument（npm 26MB / openclaw 24MB）を
        # HTTP/2 で読み切れるようになり、`mise lock` が npm ツールの依存グラフ + digest を固定できる。
        # 2026.10.12 では "too_many_data_frames" で relock が失敗する。
        description: mise-en-place (jdx 公式)
      settings: { id: jdx.mise, source: winget, version: '2026.11.14' }

    # --- Dev CLI (cannot be validated by mise / Windows-only) ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Git (The Git Development Community)
      settings: { id: Git.Git, source: winget, version: '2.55.0.5' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: openssl
      directives:
        description: OpenSSL Light (Shining Light Productions)
      settings: { id: ShiningLight.OpenSSL.Light, source: winget, version: '4.0.3' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: curl
      directives:
        description: curl (curl.se) — 手動 zip の古い 8.7.1 を置き換える（CVE 対応のため winget で管理）
      settings: { id: cURL.cURL, source: winget, version: '8.23.0.5' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: fd
      directives:
        description: fd (sharkdp) — mise は検証 [none] のため winget
      settings: { id: sharkdp.fd, source: winget, version: '10.5.0' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rustup
      directives:
        description: Rustup (Rust Project)
      settings: { id: Rustlang.Rustup, source: winget, version: '1.29.2' }

    # --- Foundation (must be kept) ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: docker-desktop
      directives:
        description: Docker Desktop (Docker Inc.)
      settings: { id: Docker.DockerDesktop, source: winget, version: '4.99.0' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: docker-sbx
      directives:
        description: Docker Sandboxes / sbx (Docker Inc.) — sandboxes\ のデータは保持
      settings: { id: Docker.sbx, source: winget, version: '0.54.1' }

    # --- Official Store packages (explicit msstore) ---
    # WSL: カーネルのセキュリティ修正が頻繁なため、Store 自動更新に任せる（AGENTS.md ①）。
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      directives:
        description: WSL (Microsoft Store, Microsoft Corp.)
      settings: { id: 9P9TQF7MRM4R, source: msstore }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ubuntu
      directives:
        description: Ubuntu (Microsoft Store, Canonical Group Limited)
      settings: { id: 9PDXGNCFSCZV, source: msstore }

    # --- PowerShell: official Microsoft Store package (msstore) ---
    # Store 版（publisher: Microsoft Corporation）が実体で、MSI は 2026-10-15 に削除済み。
    # msstore はバージョン固定できないが、Store が更新するため比較対象外（AGENTS.md ①）。
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powershell
      directives:
        description: PowerShell 7 (Microsoft Store, Microsoft Corporation)
      settings: { id: 9MZ1SNWT0N5D, source: msstore }

    # --- APM: mise 不可（旧 pypi:apm-cli は既定 Python 3.15 で pyyaml の cp315 wheel が無い） ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: apm
      directives:
        description: APM - Agent Package Manager CLI (Microsoft Corporation) — Skills 配布に使用（winget-vs-mise.md §6 / §10）
      settings: { id: Microsoft.APM, source: winget, version: '0.35.0' }

    # --- AI CLI: Google Antigravity CLI (`agy`) ---
    # 公式配布は GCS（storage.googleapis.com/antigravity-public）の単体 exe。winget マニフェストは
    # 同じ URL + SHA256 を記録した portable で、実物の Authenticode は CN=Google LLC で Valid（2026-11-28 実測）。
    # mise github バックエンドでも同一バイナリ（zip 内 antigravity.exe）を取れるが、`mise tool` の
    # Security は [none]（署名未検証）でコマンド名も `agy` にならないため winget を採用（AUDIT.md §3）。
    # バイナリは既定で自己更新するため、User 環境変数 `AGY_CLI_DISABLE_AUTO_UPDATE=1` で上流の更新を止め、
    # 更新経路を winget（Renovate → PR → DSC）だけに限定する。設定は verify-host の `agy-self-update` が検査する。
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: antigravity-cli
      directives:
        description: Google Antigravity CLI (`agy`, portable, Google LLC 署名・自己更新あり)
      settings: { id: Google.AntigravityCLI, source: winget, version: '1.5.18' }

    # --- GUI apps (mise 対象外 / winget ピン対象外) ---
    # T3 Code desktop (`T3Tools.T3Code`) は自己更新のため、ここにはピンしない。
    # winget マニフェストは 0.0.45 だが実体は 0.1.11（公式サイト / GitHub Releases で導入）。
    # ここに載せると 0.0.45 へダウングレードしかねないため、例外は exceptions.tsv に登録し、
    # tools/verify-host.ps1 が存在と Authenticode 署名（T3 Tools Inc）を確認する。
    # CLI 側 (`npm:t3` 0.1.11) は mise/mise.toml で管理する（winget-vs-mise.md §8.1）。
