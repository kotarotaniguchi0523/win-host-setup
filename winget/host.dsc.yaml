# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# winget declaration for the Windows host (idempotent, version-pinned). Apply: winget configure winget/host.dsc.yaml
# Policy: AGENTS.md / AUDIT.md. mise-managed items live on the mise/config.toml side. Use source: msstore explicitly for Store apps.
properties:
  configurationVersion: 0.2.0
  resources:
    # --- Dev foundation ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: mise
      directives:
        description: mise-en-place (jdx 公式)
      settings: { id: jdx.mise, source: winget, version: '2026.10.12' }

    # --- Dev CLI (cannot be validated by mise / Windows-only) ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Git (The Git Development Community)
      settings: { id: Git.Git, source: winget, version: '2.55.0.5' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: openssl
      directives:
        description: OpenSSL Light (Shining Light Productions)
      settings: { id: ShiningLight.OpenSSL.Light, source: winget, version: '4.0.3' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: cloudflared
      directives:
        description: cloudflared (Cloudflare) — mise は検証 [none] のため winget
      settings: { id: Cloudflare.cloudflared, source: winget, version: '2026.10.1' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: fd
      directives:
        description: fd (sharkdp) — mise は検証 [none] のため winget
      settings: { id: sharkdp.fd, source: winget, version: '10.5.0' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rustup
      directives:
        description: Rustup (Rust Project)
      settings: { id: Rustlang.Rustup, source: winget, version: '1.29.1' }

    # --- Official Store versions (explicit msstore) ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ngrok-store
      directives:
        description: "ngrok — 公式 Microsoft Store 版 (publisher ngrok)"
      settings: { id: 9MVS1J51GMK6, source: msstore }

    # --- Foundation (must be kept) ---
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: docker-desktop
      directives:
        description: Docker Desktop (Docker Inc.)
      settings: { id: Docker.DockerDesktop, source: winget, version: '4.95.0' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: docker-sbx
      directives:
        description: Docker Sandboxes / sbx (Docker Inc.) — sandboxes\ のデータは保持
      settings: { id: Docker.sbx, source: winget, version: '0.48.0' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      directives:
        description: WSL (modern, Microsoft)
      settings: { id: Microsoft.WSL, source: winget, version: '2.7.14.0' }

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ubuntu
      directives:
        description: Ubuntu (Canonical, Store MSIX)
      settings: { id: Canonical.Ubuntu, source: winget, version: '2604.1.75.0' }

    # --- PowerShell: using the MSI (winget, official Microsoft) ---
    # Alternative: msstore 9MZ1SNWT0N5D (publisher: Microsoft Corporation). Switching is separate and careful since it is the running shell.
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powershell
      directives:
        description: PowerShell 7 (MSI, Microsoft Corporation)
      settings: { id: Microsoft.PowerShell, source: winget, version: '7.6.7.0' }
