[project]
name = "pathctl"
version = "0.1.0"
description = "Inspect and repair the Windows global PATH, and list the tools that are usable globally (via mise, winget, npm or directly)"
readme = "README.md"
# The code needs 3.14 for t-strings (PEP 750); CI and the host run the pinned 3.15.0.
# The floor is not raised to 3.15 because Dependabot's dependency-graph updater supports
# Python up to 3.14.* only and would fail with `tool_version_not_supported`.
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pathctl = "pathctl.cli:main"

[dependency-groups]
dev = ["ty"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ty.environment]
python-version = "3.15"
