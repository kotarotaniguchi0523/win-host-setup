[project]
name = "pathctl"
version = "0.1.2"
description = "Inspect and repair the Windows global PATH, and list the tools that are usable globally (via mise, winget, npm or directly)"
readme = "README.md"
# 3.15 is required for PEP 810 `lazy import` (used for ctypes / winreg / json / unicodedata).
requires-python = ">=3.15"
dependencies = []
keywords = ["windows", "path", "environment", "cli", "mise"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Shells",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/kotarotaniguchi0523/win-host-setup"
Issues = "https://github.com/kotarotaniguchi0523/win-host-setup/issues"

[project.scripts]
pathctl = "pathctl.cli:main"

[dependency-groups]
dev = ["ty"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ty.environment]
# pathctl is a Windows tool: the registry API (winreg) is only visible when the target platform
# is win32. Without this, `ty check` on the Linux runner reports unresolved attributes.
python-version = "3.15"
python-platform = "win32"
