[project]
name = "pathctl"
version = "0.1.0"
description = "Inspect and repair the Windows global PATH, and list the tools that are usable globally (via mise, winget, npm or directly)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
pathctl = "pathctl.cli:main"

[dependency-groups]
dev = ["ty"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ty.environment]
python-version = "3.15"
