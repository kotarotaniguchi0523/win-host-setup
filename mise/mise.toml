[tools]
betterleaks            = "1.9.0"
node                   = ["26.11.1", "24.21.0"]
python                 = ["3.15.0", "3.14.8"]
gh                     = "2.102.0"
doppler                = "3.76.0"
# APM: managed via winget `Microsoft.APM` 0.33.0 (Publisher: Microsoft).
# Migrated to winget because the old `pypi:apm-cli` cannot be installed on default Python 3.15 (dependency `pyyaml` has no cp315 wheel) (see winget-vs-mise.md, section 6)
"aqua:k1LoW/mo"        = "1.5.5"
"github:microsoft/waza" = "0.38.10"
rtk                    = "0.40.0"
pnpm                   = "12.12.1"
uv                     = "0.13.0"
go                     = "1.27.2"
"aqua:jj-vcs/jj"       = "0.46.0"
jq                     = "1.8.2"
"aqua:microsoft/tgrep" = "1.2.0"
"ubi:yusukebe/ax"      = "0.1.25"
dotenvx                = "2.34.2"
"npm:secretlint"       = "13.0.7"
"npm:textlint"         = "15.8.0"
"npm:ctx7"             = "0.6.0"
nushell                = "0.116.1"
"npm:agent-browser"    = "0.39.0"
"npm:openclaw"         = "2026.10.3"
herdr                  = "0.9.3"
pi                     = "1.2.0"
rust                   = "1.99.0"
# rust-analyzer: managed via winget `Rustlang.rust-analyzer` (the aqua version has Security [none]. See winget-vs-mise.md, section 3)
npm = "12.2.0"
# SkillSpector: yara-python 4.5.4 has no cp314/cp315 wheel -> build this tool alone with Python 3.13.16 (installed; pending runtime verification)
"pypi:git+https://github.com/nvidia/skillspector.git" = { version = "v2.12.0", uvx_args = "--python 3.13.16" }

[settings]
paranoid            = true
locked              = true
locked_verify_provenance = true
minimum_release_age = "2d"
pin                 = true

[settings.npm]
package_manager = "pnpm"

[settings.pypi]
registry_url = "https://pypi.flatt.tech/simple/{}/"

[env]
PIP_INDEX_URL = "https://pypi.flatt.tech/simple/"
UV_INDEX_URL  = "https://pypi.flatt.tech/simple/"
NPM_CONFIG_REGISTRY = "https://npm.flatt.tech/"

# --- APM / SkillSpector (security scanners for skills / skill assets) ---
# APM           : pypi:apm-cli@0.33.0 (= official PyPI distribution of github.com/microsoft/apm.
#                 consolidated from the old github:microsoft/apm@0.14.0) -> locked via Takumi and the uv dependency graph (wheel hashes)
# SkillSpector  : pypi:git+https://github.com/nvidia/skillspector.git@v2.12.0 (git source because not published on PyPI)
#                 -> dependency yara-python 4.5.4 has no cp314 wheel, so use Python 3.13.16 for this tool only
# Verify        : apm audit --external skillspector
