[tools]
betterleaks            = "1.9.0"
node                   = ["26.12.1", "24.22.1"]
python                 = ["3.15.2", "3.14.8"]
gh                     = "2.103.3"
# ghtkn: GitHub App user access token provider. Used as the git credential helper
# (`!ghtkn git-credential`) instead of stored PATs / OAuth tokens.
"aqua:suzuki-shunsuke/ghtkn" = "0.4.3"
doppler                = "3.77.1"
# APM: winget `Microsoft.APM` 0.35.0 で管理（Publisher: Microsoft Corporation。宣言は winget/host.dsc.yaml）。
# 旧 `pypi:apm-cli` は既定 Python 3.15 で依存 `pyyaml` の cp315 wheel が無く導入不可のため winget へ移行（winget-vs-mise.md §6 / §10.3）
"aqua:k1LoW/mo"        = "1.7.0"
"github:microsoft/waza" = "v0.39.1"
rtk                    = "v1.1.0"
pnpm                   = "12.16.0"
uv                     = "0.13.6"
go                     = "1.27.3"
"aqua:jj-vcs/jj"       = "0.46.0"
jq                     = "1.8.2"
"aqua:microsoft/tgrep" = "1.2.4"
"ubi:yusukebe/ax"      = "0.1.25"
dotenvx                = "2.38.2"
"npm:secretlint"       = "13.1.0"
"npm:textlint"         = "15.8.0"
"npm:ctx7"             = "0.8.2"
# agent-desktop: Vercel Labs のデスクトップ操作 CLI。npm は sha512 integrity + SLSA provenance、
# 実バイナリ（win32-x64 ほか）は同梱で postinstall が link するため allow_builds を許可する。
"npm:agent-desktop"    = { version = "1.0.2", allow_builds = ["agent-desktop"] }
nushell                = "0.116.1"
"npm:agent-browser"    = "0.39.4"
"npm:openclaw"         = "2026.10.7"
herdr                  = "v0.9.5"
pi                     = "v1.4.0"
rust                   = "1.99.1"
# rust-analyzer: winget `Rustlang.rust-analyzer` で管理（aqua 版は Security [none] のため。winget-vs-mise.md §3）
npm = "12.2.1"
# SkillSpector: yara-python 4.5.4 は cp314/cp315 の wheel が無い → このツールのみ Python 3.13.16 で構築（インストール済・動作確認待ち）
"pypi:git+https://github.com/nvidia/skillspector.git" = { version = "v2.13.1", uvx_args = "--python 3.13.16" }
# postinstall で実バイナリ（約 200 MB）を取得するツール。mise は既定で dependency の
# build script を実行しないので、このツールだけ allow_builds で許可する（他は既定のまま）。
# allow_builds は installer 非依存で、pnpm なら --allow-build=<pkg>、npm 11.16+ なら
# --allow-scripts=<pkg>、組み込み aube なら aube.allowBuilds に変換される。
"npm:@opencode/cli" = { version = "2.1.4", allow_builds = ["@opencode/cli"] }
"npm:@openai/codex" = "0.164.0"
# T3 Code CLI（`t3` = ローカル server + Web UI）。npm は sha512 integrity + SLSA provenance、
# 実バイナリは optionalDependencies（@t3code/t3-win32-x64）で postinstall 不要。
# winget の desktop 版は 0.0.45 と遅れ、CLI を PATH に載せる操作もアプリ側（mise 管理外）になるため、
# グローバル CLI は mise の npm backend で 0.1.0 に固定する。
"npm:t3" = "0.1.3"
"go:golang.org/x/tools/gopls" = "v0.24.0"
"github:init-co-jp/diff-tour" = "v0.6.0"

[settings]
paranoid            = true
locked              = true
locked_verify_provenance = true
minimum_release_age = "2d"
pin                 = true

[settings.npm]
# installer: npm / pnpm / bun / aube（組み込み）/ aube_cli。
# build script の許可は tool 側の allow_builds で行う（installer 非依存）。
package_manager = "pnpm"

[settings.pypi]
registry_url = "https://pypi.flatt.tech/simple/{}/"

[env]
PIP_REQUIRE_VIRTUALENV = "true"  # pip install を venv 外で失敗させる（うっかりグローバル防止）
PIP_INDEX_URL = "https://pypi.flatt.tech/simple/"
UV_INDEX_URL  = "https://pypi.flatt.tech/simple/"
NPM_CONFIG_REGISTRY = "https://npm.flatt.tech/"

# --- APM / SkillSpector（スキル / スキル資産のセキュリティスキャナ）---
# APM           : pypi:apm-cli@0.33.0（= github.com/microsoft/apm の公式 PyPI 配布。
#                 旧 github:microsoft/apm@0.14.0 から一本化）→ Takumi 経由・uv 依存グラフ（wheel ハッシュ）で lock
# SkillSpector  : pypi:git+https://github.com/nvidia/skillspector.git@v2.12.0（PyPI 未公開のため git ソース）
#                 → 依存の yara-python 4.5.4 は cp314 wheel が無いため、このツールのみ Python 3.13.16 を使用
# 検証          : apm audit --external skillspector
