# APM（Agent Package Manager）のグローバル・マニフェスト
# 実体の配置先: ~/.apm/apm.yml   （tools/skills-apply.ps1 が配置）
# 使い方: ここに owner/repo#ref を足すと Renovate（apm マネージャ）が自動で更新します。
name: win-host-setup
version: 1.0.0
description: このホストで使うグローバル Skills / APM パッケージ（検証重視・バージョン固定）

dependencies:
  apm:
    # リモート Skill（リポジトリ内の skills/*/SKILL.md を取得）
    - vercel-labs/agent-browser#v0.39.1
    - yusukebe/ax#v0.1.25

devDependencies:
  apm: []

# --- 追加方法 ---
#   1. ここに `owner/repo#<tag>` を追記
#   2. pwsh -File tools/skills-apply.ps1 -Lock   （~/.apm へ配置 + apm.lock.yaml 再生成）
#   3. pwsh -File tools/skills-apply.ps1         （グローバルへ適用）
#   ※ `#<ref>` を必ず付けると Renovate が更新対象にします。
#     SHA 固定 + 末尾コメント（# v1.0.0）にすると pinDigests が両方を追随させます。
